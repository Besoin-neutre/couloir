<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Couloir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Mise en page : une seule colonne centrée, comme un couloir de piste. */
:root {
  --bg: #f3f5f7;          /* fond de page */
  --surface: #ffffff;     /* cartes */
  --ink: #17212b;         /* texte principal */
  --muted: #5d6b78;       /* texte secondaire */
  --line: #d6dde3;        /* bordures */
  --track: #b8432f;       /* rouge tartan (couleur d'accent) */
  --track-ink: #ffffff;
  --coach: #2f5d8a;       /* bleu pour repérer les coachs */
  --ok: #2d7a4b;          /* vert de confirmation */
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Source Sans 3", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11171d; --surface: #1a232c; --ink: #e8edf1; --muted: #9aa8b4;
    --line: #2d3a46; --track: #e0664f; --track-ink: #11171d; --coach: #7fb0de; --ok: #6cc28e;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(32px + env(safe-area-inset-top, 0px)) calc(48px + env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 520px; margin: 0 auto; display: grid; gap: 24px; }

/* En-tête avec les lignes de couloir */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 12px; }
.lanes { display: flex; gap: 3px; }
.lanes span { width: 4px; height: 26px; background: var(--track); border-radius: 1px; }
.lanes span:nth-child(2) { opacity: .7; }
.lanes span:nth-child(3) { opacity: .45; }
.brand h1 {
  font-family: var(--display); font-weight: 700; font-size: 28px;
  letter-spacing: .04em; text-transform: uppercase; margin: 0;
}
.session { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
.session b { color: var(--ink); }

.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; padding: 24px; display: grid; gap: 18px;
}
h2 {
  font-family: var(--display); font-weight: 500; font-size: 30px;
  line-height: 1.1; margin: 0; text-wrap: balance;
}
h3 {
  font-family: var(--display); font-weight: 500; font-size: 22px;
  margin: 0; letter-spacing: .02em;
}
.intro { color: var(--muted); margin: -8px 0 0; }
.muted { color: var(--muted); margin: 0; }

/* Onglets Connexion / Inscription */
.onglets { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 8px; padding: 4px; gap: 4px; }
.onglets button { background: transparent; color: var(--muted); border-color: transparent; padding: 8px 10px; }
.onglets button[aria-pressed="true"] { background: var(--track); color: var(--track-ink); }

/* Formulaires */
form { display: grid; gap: 16px; }
.groupe { display: grid; gap: 16px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 420px) { .row { grid-template-columns: 1fr; } }
.field { display: grid; gap: 6px; min-width: 0; }
label, .label { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
input, select, textarea {
  font: inherit; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; width: 100%;
}
textarea { min-height: 150px; resize: vertical; line-height: 1.45; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--track); outline-offset: 2px; }
.aide { font-size: 13px; color: var(--muted); margin: 0; }
.error { color: var(--track); font-size: 14px; margin: 0; }
.ok { color: var(--ok); font-size: 14px; font-weight: 600; margin: 0; }

/* Boutons */
button {
  font: inherit; font-weight: 600; cursor: pointer; border-radius: 6px; padding: 12px 16px;
  border: 1px solid var(--track); background: var(--track); color: var(--track-ink);
}
button[disabled] { opacity: .6; cursor: wait; }
button.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
button.lien {
  background: none; border: 0; padding: 0; color: var(--track); font-weight: 600;
  text-decoration: underline; text-underline-offset: 3px;
}
.actions { display: flex; flex-wrap: wrap; gap: 10px; }

/* Badges de rôle */
.badge {
  flex: none; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 99px; border: 1px solid var(--track); color: var(--track);
}
.badge.coach { border-color: var(--coach); color: var(--coach); }

/* Écrans d'accueil */
.hello { font-family: var(--display); font-weight: 700; font-size: 44px; line-height: 1; margin: 0; text-transform: uppercase; letter-spacing: .02em; overflow-wrap: anywhere; }
.hello em { font-style: normal; color: var(--track); }
.hello.coach em { color: var(--coach); }
dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; }
dt { color: var(--muted); font-size: 14px; }
dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.entete-liste { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }

/* Séances */
.seances { display: grid; gap: 12px; }
.seance { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 6px; background: var(--bg); }
.seance-date { font-size: 13px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--track); }
.seance-titre { font-weight: 600; font-size: 18px; margin: 0; }
.seance-contenu { white-space: pre-line; margin: 0; overflow-wrap: anywhere; }
.seance-pied { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
.vide { border: 1px dashed var(--line); border-radius: 8px; padding: 16px; color: var(--muted); margin: 0; }

@media (prefers-reduced-motion: no-preference) {
  .card { animation: in .25s ease-out; }
  @keyframes in { from { transform: translateY(6px); } to { transform: none; } }
}
</style>
<!-- Bibliothèque officielle de Supabase (le « traducteur » entre le site et la base de données) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <div class="lanes" aria-hidden="true"><span></span><span></span><span></span></div>
      <h1>Couloir</h1>
    </div>
    <div class="session" id="session" hidden>
      <span id="session-nom"></span>
      <button class="lien" type="button" id="deconnexion">Se déconnecter</button>
    </div>
  </div>

  <!-- ÉCRAN 0 : chargement / erreur générale -->
  <section class="card" id="ecran-chargement">
    <p class="muted" id="message-chargement">Chargement…</p>
  </section>

  <!-- ÉCRAN 1 : connexion ou inscription -->
  <section class="card" id="ecran-connexion" hidden>
    <div class="onglets" role="group" aria-label="Choisir">
      <button type="button" id="onglet-connexion" aria-pressed="true">Se connecter</button>
      <button type="button" id="onglet-inscription" aria-pressed="false">Créer un compte</button>
    </div>

    <form id="form-connexion" novalidate>
      <!-- Champs affichés seulement pour l'inscription -->
      <div class="groupe" id="champs-inscription" hidden>
        <div class="row">
          <div class="field">
            <label for="ins-prenom">Prénom</label>
            <input id="ins-prenom" autocomplete="given-name" placeholder="Lila">
          </div>
          <div class="field">
            <label for="ins-nom">Nom</label>
            <input id="ins-nom" autocomplete="family-name" placeholder="Martin">
          </div>
        </div>
        <div class="field">
          <label for="ins-discipline">Discipline principale</label>
          <select id="ins-discipline"></select>
        </div>
      </div>

      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="email" placeholder="prenom@exemple.fr">
      </div>
      <div class="field">
        <label for="mdp">Mot de passe</label>
        <input id="mdp" type="password" autocomplete="current-password">
        <p class="aide" id="aide-mdp" hidden>Au moins 6 caractères.</p>
      </div>

      <p class="error" id="erreur-connexion" hidden></p>
      <p class="ok" id="ok-connexion" hidden></p>
      <button type="submit" id="bouton-connexion">Se connecter</button>
    </form>
  </section>

  <!-- ÉCRAN 2 : compléter ou modifier son profil -->
  <section class="card" id="ecran-profil" hidden>
    <h2 id="titre-profil">Ton profil</h2>
    <form id="form-profil" novalidate>
      <div class="row">
        <div class="field">
          <label for="prenom">Prénom</label>
          <input id="prenom" autocomplete="given-name">
        </div>
        <div class="field">
          <label for="nom">Nom</label>
          <input id="nom" autocomplete="family-name">
        </div>
      </div>
      <div class="field">
        <label for="discipline">Discipline principale</label>
        <select id="discipline"></select>
      </div>
      <p class="aide" id="info-role"></p>
      <p class="error" id="erreur-profil" hidden></p>
      <div class="actions">
        <button type="submit" id="bouton-profil">Enregistrer</button>
        <button type="button" class="ghost" id="annuler-profil">Retour</button>
      </div>
    </form>
  </section>

  <!-- ÉCRAN 3 : espace athlète -->
  <section class="card" id="ecran-athlete" hidden>
    <p class="hello">Salut <em id="athlete-prenom"></em>&nbsp;!</p>
    <dl>
      <dt>Discipline</dt><dd id="athlete-discipline"></dd>
    </dl>
    <div class="entete-liste">
      <h3>Mes séances</h3>
      <button type="button" class="lien" id="actualiser">Actualiser</button>
    </div>
    <div class="seances" id="athlete-seances"></div>
    <button class="ghost" type="button" id="modifier-athlete" style="justify-self:start">Modifier mon profil</button>
  </section>

  <!-- ÉCRAN 4 : espace coach -->
  <section class="card" id="ecran-coach" hidden>
    <p class="hello coach">Salut <em id="coach-prenom"></em>&nbsp;!</p>
    <p class="muted">Choisis un athlète et écris-lui sa séance.</p>

    <p class="vide" id="coach-aucun" hidden>Aucun athlète inscrit pour l'instant. Dès qu'un athlète aura créé son compte, il apparaîtra ici.</p>

    <form id="form-seance" novalidate>
      <div class="field">
        <label for="choix-athlete">Athlète</label>
        <select id="choix-athlete"></select>
      </div>
      <div class="row">
        <div class="field">
          <label for="seance-date">Date</label>
          <input id="seance-date" type="date">
        </div>
        <div class="field">
          <label for="seance-titre">Titre</label>
          <input id="seance-titre" placeholder="Fractionné 400 m">
        </div>
      </div>
      <div class="field">
        <label for="seance-contenu">Contenu de la séance</label>
        <textarea id="seance-contenu" placeholder="Échauffement : 20 min footing + gammes&#10;Corps de séance : 2 × (5 × 400 m), r = 1 min, R = 4 min&#10;Retour au calme : 10 min footing + étirements"></textarea>
      </div>
      <p class="error" id="erreur-seance" hidden></p>
      <p class="ok" id="ok-seance" hidden></p>
      <button type="submit" id="bouton-seance" style="justify-self:start">Envoyer la séance</button>
    </form>

    <h3 id="coach-titre-liste">Séances envoyées</h3>
    <div class="seances" id="coach-seances"></div>
    <button class="ghost" type="button" id="modifier-coach" style="justify-self:start">Modifier mon profil</button>
  </section>
</div>

<script>
/* =========================================================
   1. CONNEXION À SUPABASE
   Ces deux informations sont publiques : la sécurité vient
   des règles écrites dans Supabase (SQL Editor).
   ========================================================= */
const SUPABASE_URL = "https://qpsmqkldksginhhyndsu.supabase.co";
const SUPABASE_CLE = "sb_publishable_LXOO1mpZnjwJhmLrNqGHIQ_-i7lmIfZ";

const DISCIPLINES = [
  "Sprint (60 m – 400 m)", "Haies", "Demi-fond (800 m – 1 500 m)",
  "Fond (5 km – 10 km)", "Sauts", "Lancers", "Trail",
];

const $ = (id) => document.getElementById(id);

if (!window.supabase) {
  $("message-chargement").textContent = "Le site n'a pas pu charger ses outils. Vérifie ta connexion Internet, puis recharge la page.";
  throw new Error("Bibliothèque Supabase introuvable");
}
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_CLE);

/* =========================================================
   2. LES DONNÉES : toutes les lectures et écritures dans la base
   ========================================================= */
// Petite aide : si Supabase renvoie une erreur, on la « lance » pour l'afficher
function verifier({ data, error }) { if (error) throw error; return data; }

const donnees = {
  async monProfil(userId) {
    return verifier(await sb.from("profils").select("*").eq("id", userId).maybeSingle());
  },
  async creerProfil(p) {
    verifier(await sb.from("profils").insert(p));
  },
  async modifierProfil(id, champs) {
    verifier(await sb.from("profils").update(champs).eq("id", id));
  },
  async athletes() {
    return verifier(await sb.from("profils").select("id, prenom, nom, discipline").eq("role", "Athlète").order("prenom"));
  },
  async seancesDe(athleteId) {
    return verifier(await sb.from("seances")
      .select("id, date, titre, contenu, coach:profils!seances_coach_id_fkey(prenom, nom)")
      .eq("athlete_id", athleteId)
      .order("date", { ascending: true }));
  },
  async envoyerSeance(s) {
    verifier(await sb.from("seances").insert(s));
  },
  async supprimerSeance(id) {
    verifier(await sb.from("seances").delete().eq("id", id));
  },
};

/* =========================================================
   3. PETITS OUTILS
   ========================================================= */
// Crée un élément HTML (le texte est inséré tel quel, sans risque)
function el(balise, attributs = {}, enfants = []) {
  const e = document.createElement(balise);
  for (const [k, v] of Object.entries(attributs)) e.setAttribute(k, v);
  (Array.isArray(enfants) ? enfants : [enfants]).forEach((c) => c != null && e.append(c));
  return e;
}
function isoLocal(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function demain() { const d = new Date(); d.setDate(d.getDate() + 1); return isoLocal(d); }
// « 2026-10-30 » devient « vendredi 30 octobre »
function formatDate(iso) {
  if (!iso) return "Date à préciser";
  const [a, m, j] = iso.split("-").map(Number);
  return new Date(a, m - 1, j).toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
}
function nomComplet(p) { return p ? (p.prenom + " " + (p.nom || "")).trim() : "Coach"; }

// Remplit une liste déroulante de disciplines
function remplirDisciplines(select) {
  select.replaceChildren(...DISCIPLINES.map((d) => el("option", {}, d)));
}
remplirDisciplines($("ins-discipline"));
remplirDisciplines($("discipline"));

// Traduit les messages d'erreur de Supabase en français clair
function messageErreur(e) {
  const m = (e && (e.message || e.error_description)) || String(e);
  if (/Invalid login credentials/i.test(m)) return "E-mail ou mot de passe incorrect.";
  if (/already (been )?registered/i.test(m)) return "Un compte existe déjà avec cet e-mail. Connecte-toi plutôt.";
  if (/Password should be at least|weak password/i.test(m)) return "Le mot de passe doit contenir au moins 6 caractères.";
  if (/Email not confirmed/i.test(m)) return "Ton adresse e-mail n'est pas encore confirmée. Ouvre l'e-mail de confirmation, puis réessaie.";
  if (/valid email|invalid format/i.test(m)) return "Cette adresse e-mail n'est pas valide.";
  if (/rate limit|security purposes/i.test(m)) return "Trop de tentatives d'affilée. Patiente une minute, puis réessaie.";
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return "Impossible de joindre le serveur. Vérifie ta connexion Internet.";
  if (/row-level security|permission denied/i.test(m)) return "Action refusée : tu n'as pas les droits nécessaires.";
  return "Une erreur est survenue : " + m;
}
function afficherMessage(id, texte) { const p = $(id); p.textContent = texte || ""; p.hidden = !texte; }

// Désactive un bouton pendant qu'on attend la réponse du serveur
async function pendant(bouton, texteAttente, action) {
  const texte = bouton.textContent;
  bouton.disabled = true; bouton.textContent = texteAttente;
  try { return await action(); }
  finally { bouton.disabled = false; bouton.textContent = texte; }
}

// N'affiche qu'un seul écran à la fois
const ECRANS = ["ecran-chargement", "ecran-connexion", "ecran-profil", "ecran-athlete", "ecran-coach"];
function montrer(id) {
  ECRANS.forEach((e) => ($(e).hidden = e !== id));
  window.scrollTo(0, 0);
}

/* =========================================================
   4. QUI EST CONNECTÉ ?
   ========================================================= */
let moi = null; // le profil de la personne connectée

async function apresConnexion(user) {
  montrer("ecran-chargement");
  $("message-chargement").textContent = "Chargement de ton profil…";
  try {
    moi = await donnees.monProfil(user.id);
    // Premier passage : on crée le profil avec les infos données à l'inscription
    if (!moi) {
      const infos = user.user_metadata || {};
      if (infos.prenom) {
        await donnees.creerProfil({ id: user.id, prenom: infos.prenom, nom: infos.nom || null, discipline: infos.discipline || null });
        moi = await donnees.monProfil(user.id);
      }
    }
    if (!moi) { ouvrirFormulaireProfil(true); return; }
    router();
  } catch (e) {
    $("message-chargement").textContent = messageErreur(e);
  }
}

function router() {
  $("session").hidden = !moi;
  if (moi) $("session-nom").replaceChildren(el("b", {}, moi.prenom), " · " + moi.role);
  if (!moi) return afficherConnexion();
  if (moi.role === "Coach") afficherCoach();
  else afficherAthlete();
}

$("deconnexion").addEventListener("click", async () => {
  await sb.auth.signOut();
  moi = null;
  router();
});

/* =========================================================
   5. ÉCRAN DE CONNEXION / INSCRIPTION
   ========================================================= */
let modeInscription = false;

function afficherConnexion() {
  afficherMessage("erreur-connexion", "");
  montrer("ecran-connexion");
}

function changerMode(inscription) {
  modeInscription = inscription;
  $("onglet-connexion").setAttribute("aria-pressed", String(!inscription));
  $("onglet-inscription").setAttribute("aria-pressed", String(inscription));
  $("champs-inscription").hidden = !inscription;
  $("aide-mdp").hidden = !inscription;
  $("mdp").setAttribute("autocomplete", inscription ? "new-password" : "current-password");
  $("bouton-connexion").textContent = inscription ? "Créer mon compte" : "Se connecter";
  afficherMessage("erreur-connexion", "");
  afficherMessage("ok-connexion", "");
}
$("onglet-connexion").addEventListener("click", () => changerMode(false));
$("onglet-inscription").addEventListener("click", () => changerMode(true));

$("form-connexion").addEventListener("submit", async (event) => {
  event.preventDefault();
  afficherMessage("erreur-connexion", "");
  afficherMessage("ok-connexion", "");
  const email = $("email").value.trim();
  const motDePasse = $("mdp").value;
  if (!email || !motDePasse) return afficherMessage("erreur-connexion", "Indique ton e-mail et ton mot de passe.");

  try {
    await pendant($("bouton-connexion"), "Un instant…", async () => {
      if (modeInscription) {
        const prenom = $("ins-prenom").value.trim();
        if (!prenom) throw new Error("Indique ton prénom pour créer ton compte.");
        const { data, error } = await sb.auth.signUp({
          email, password: motDePasse,
          options: { data: { prenom, nom: $("ins-nom").value.trim(), discipline: $("ins-discipline").value } },
        });
        if (error) throw error;
        if (data.session) return apresConnexion(data.user);
        // Si la confirmation par e-mail est activée dans Supabase
        changerMode(false);
        afficherMessage("ok-connexion", "Compte créé ! Confirme ton adresse grâce à l'e-mail reçu, puis connecte-toi.");
      } else {
        const { data, error } = await sb.auth.signInWithPassword({ email, password: motDePasse });
        if (error) throw error;
        return apresConnexion(data.user);
      }
    });
  } catch (e) {
    afficherMessage("erreur-connexion", e.message?.startsWith("Indique") ? e.message : messageErreur(e));
  }
});

/* =========================================================
   6. FORMULAIRE DE PROFIL
   ========================================================= */
let creationProfil = false;

function ouvrirFormulaireProfil(creation) {
  creationProfil = creation;
  afficherMessage("erreur-profil", "");
  $("titre-profil").textContent = creation ? "Complète ton profil" : "Modifier mon profil";
  $("annuler-profil").hidden = creation;
  $("prenom").value = moi?.prenom || "";
  $("nom").value = moi?.nom || "";
  $("discipline").value = moi?.discipline || DISCIPLINES[0];
  $("info-role").textContent = moi
    ? (moi.role === "Coach" ? "Ton rôle : Coach." : "Ton rôle : Athlète. Le rôle Coach est attribué par l'administratrice du site.")
    : "";
  montrer("ecran-profil");
}

$("form-profil").addEventListener("submit", async (event) => {
  event.preventDefault();
  const champs = { prenom: $("prenom").value.trim(), nom: $("nom").value.trim() || null, discipline: $("discipline").value };
  if (!champs.prenom) return afficherMessage("erreur-profil", "Indique ton prénom.");
  try {
    await pendant($("bouton-profil"), "Enregistrement…", async () => {
      const { data } = await sb.auth.getUser();
      if (creationProfil) await donnees.creerProfil({ id: data.user.id, ...champs });
      else await donnees.modifierProfil(moi.id, champs);
      moi = await donnees.monProfil(data.user.id);
    });
    router();
  } catch (e) {
    afficherMessage("erreur-profil", messageErreur(e));
  }
});
$("annuler-profil").addEventListener("click", router);
$("modifier-athlete").addEventListener("click", () => ouvrirFormulaireProfil(false));
$("modifier-coach").addEventListener("click", () => ouvrirFormulaireProfil(false));

/* =========================================================
   7. ESPACE ATHLÈTE : voir ses séances
   ========================================================= */
function carteSeance(s, { avecCoach = false, supprimable = false } = {}) {
  const pied = el("div", { class: "seance-pied" });
  if (avecCoach) pied.append(el("span", {}, "Proposée par " + nomComplet(s.coach)));
  if (supprimable) {
    const b = el("button", { class: "lien", type: "button" }, "Supprimer");
    b.addEventListener("click", async () => {
      try { await pendant(b, "Suppression…", () => donnees.supprimerSeance(s.id)); afficherSeancesCoach(); }
      catch (e) { afficherMessage("erreur-seance", messageErreur(e)); }
    });
    pied.append(b);
  }
  return el("article", { class: "seance" }, [
    el("span", { class: "seance-date" }, formatDate(s.date)),
    s.titre ? el("p", { class: "seance-titre" }, s.titre) : null,
    s.contenu ? el("p", { class: "seance-contenu" }, s.contenu) : null,
    pied.childNodes.length ? pied : null,
  ]);
}

async function afficherAthlete() {
  $("athlete-prenom").textContent = moi.prenom;
  $("athlete-discipline").textContent = moi.discipline || "Non renseignée";
  montrer("ecran-athlete");
  await chargerSeancesAthlete();
}

async function chargerSeancesAthlete() {
  const zone = $("athlete-seances");
  zone.replaceChildren(el("p", { class: "muted" }, "Chargement des séances…"));
  try {
    const seances = await donnees.seancesDe(moi.id);
    zone.replaceChildren();
    if (seances.length === 0) zone.append(el("p", { class: "vide" }, "Pas encore de séance. Ton coach t'en enverra bientôt."));
    else seances.forEach((s) => zone.append(carteSeance(s, { avecCoach: true })));
  } catch (e) {
    zone.replaceChildren(el("p", { class: "error" }, messageErreur(e)));
  }
}
$("actualiser").addEventListener("click", chargerSeancesAthlete);

/* =========================================================
   8. ESPACE COACH : choisir un athlète et lui écrire sa séance
   ========================================================= */
const choixAthlete = $("choix-athlete");
let athletes = [];

async function afficherCoach() {
  $("coach-prenom").textContent = moi.prenom;
  afficherMessage("ok-seance", "");
  afficherMessage("erreur-seance", "");
  if (!$("seance-date").value) $("seance-date").value = demain();
  montrer("ecran-coach");

  try {
    athletes = await donnees.athletes();
  } catch (e) {
    athletes = [];
    afficherMessage("erreur-seance", messageErreur(e));
  }
  const dejaChoisi = choixAthlete.value;
  choixAthlete.replaceChildren(...athletes.map((a) => el("option", { value: a.id }, nomComplet(a) + (a.discipline ? " · " + a.discipline : ""))));
  if (athletes.some((a) => a.id === dejaChoisi)) choixAthlete.value = dejaChoisi;

  const aucun = athletes.length === 0;
  $("coach-aucun").hidden = !aucun;
  $("form-seance").hidden = aucun;
  $("coach-titre-liste").hidden = aucun;
  $("coach-seances").hidden = aucun;
  if (!aucun) afficherSeancesCoach();
}

async function afficherSeancesCoach() {
  const athlete = athletes.find((a) => a.id === choixAthlete.value);
  const zone = $("coach-seances");
  if (!athlete) { zone.replaceChildren(); return; }
  $("coach-titre-liste").textContent = "Séances de " + athlete.prenom;
  zone.replaceChildren(el("p", { class: "muted" }, "Chargement…"));
  try {
    const seances = await donnees.seancesDe(athlete.id);
    zone.replaceChildren();
    if (seances.length === 0) zone.append(el("p", { class: "vide" }, "Aucune séance envoyée à " + athlete.prenom + " pour l'instant."));
    else seances.forEach((s) => zone.append(carteSeance(s, { supprimable: true })));
  } catch (e) {
    zone.replaceChildren(el("p", { class: "error" }, messageErreur(e)));
  }
}

choixAthlete.addEventListener("change", () => {
  afficherMessage("ok-seance", "");
  afficherSeancesCoach();
});

$("form-seance").addEventListener("submit", async (event) => {
  event.preventDefault();
  afficherMessage("ok-seance", "");
  afficherMessage("erreur-seance", "");
  const athlete = athletes.find((a) => a.id === choixAthlete.value);
  const titre = $("seance-titre").value.trim();
  const contenu = $("seance-contenu").value.trim();
  const date = $("seance-date").value || null;
  if (!titre && !contenu) return afficherMessage("erreur-seance", "Donne au moins un titre ou un contenu à la séance.");

  try {
    await pendant($("bouton-seance"), "Envoi…", () =>
      donnees.envoyerSeance({ athlete_id: athlete.id, coach_id: moi.id, date, titre: titre || null, contenu: contenu || null }));
    $("seance-titre").value = "";
    $("seance-contenu").value = "";
    afficherMessage("ok-seance", "Séance envoyée à " + athlete.prenom + ".");
    afficherSeancesCoach();
  } catch (e) {
    afficherMessage("erreur-seance", messageErreur(e));
  }
});

/* =========================================================
   9. DÉMARRAGE : déjà connecté(e) sur cet appareil ?
   ========================================================= */
(async () => {
  const { data } = await sb.auth.getSession();
  if (data.session) apresConnexion(data.session.user);
  else router();
})();
</script>
